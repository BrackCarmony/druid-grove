# Druid Grove performance telemetry: the /api/perf endpoint.
# Installed to /etc/nginx/snippets/druid-grove-perf.conf and included from the site's server block.
location = /api/perf {
  limit_except POST { deny all; }
  limit_req zone=dgperf burst=10 nodelay;
  client_max_body_size 32k;
  client_body_buffer_size 32k; # keep the body in memory so $request_body is filled
  access_log /var/log/druid-grove/perf.log dgperf;
  proxy_pass http://127.0.0.1:8099;
}
