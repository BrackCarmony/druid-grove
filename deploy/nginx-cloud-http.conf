# Druid Grove cloud saves: http-level pieces.
# Installed to /etc/nginx/conf.d/druid-grove-cloud.conf (see scripts/setup-cloud-server.sh).

# A playing device uploads a save about every 30 s; new codes are rarely made.
limit_req_zone $binary_remote_addr zone=dgcloud:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=dgcloudnew:1m rate=3r/m;
