# Druid Grove cloud saves: the /api/cloud/ endpoints (deploy/cloud-server.py on port 8100).
# Installed to /etc/nginx/snippets/druid-grove-cloud.conf and included from the site's server block.
location = /api/cloud/new {
  limit_except POST { deny all; }
  limit_req zone=dgcloudnew burst=3 nodelay;
  access_log off;
  proxy_pass http://127.0.0.1:8100;
}
location /api/cloud/ {
  limit_req zone=dgcloud burst=20 nodelay;
  client_max_body_size 4m;
  access_log off; # no addresses kept
  gzip on;
  gzip_types application/json;
  proxy_pass http://127.0.0.1:8100;
}
