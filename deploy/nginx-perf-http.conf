# Druid Grove performance telemetry: http-level pieces.
# Installed to /etc/nginx/conf.d/druid-grove-perf.conf (see scripts/setup-perf-server.sh).

# One JSON line per report. The body is the game's JSON payload, escaped into a string.
# No IP address is logged; the user agent is kept to tell browsers apart.
log_format dgperf escape=json '{"ts":"$time_iso8601","ua":"$http_user_agent","body":"$request_body"}';

# Each player sends one report every 30 s, so this is generous.
limit_req_zone $binary_remote_addr zone=dgperf:1m rate=30r/m;

# nginx only fills $request_body when it proxies the request somewhere,
# so reports are proxied to this tiny local server that just says "got it".
server {
  listen 127.0.0.1:8099;
  access_log off;
  location / { return 204; }
}
